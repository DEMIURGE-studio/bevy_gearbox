[package]
name = "bevy_gearbox_macros"
version.workspace = true
edition = "2021"
description = "Derive and attribute macros for bevy_gearbox"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DEMIURGE-studio/bevy_gearbox"
homepage = "https://github.com/DEMIURGE-studio/bevy_gearbox"
keywords = ["bevy", "macros", "state-machine", "gamedev"]
categories = ["game-development", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
bevy_gearbox_macros_impl.workspace = true
proc-macro2 = "1.0"
proc-macro-crate = "3"
quote = "1.0"
