[package]
name = "bevy_gearbox_macros_impl"
version.workspace = true
edition = "2021"
description = "Implementation of the bevy_gearbox derive and attribute macros, reusable by crates that re-export bevy_gearbox"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DEMIURGE-studio/bevy_gearbox"
homepage = "https://github.com/DEMIURGE-studio/bevy_gearbox"
keywords = ["bevy", "macros", "state-machine", "gamedev"]
categories = ["game-development", "development-tools::procedural-macro-helpers"]

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
